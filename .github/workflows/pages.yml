name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Hai job, không phải một. Ngày 24/11/2026 hai lần dựng liền (#17, #18) hỏng
# cùng một lỗi: deploy-pages hỏi artifact ngay sau khi tải xong và nhận «No
# artifacts named "github-pages" were found», dù artifact 17,2 MB đã nằm trong
# run. API danh sách artifact chưa kịp ghi nhận. Kho Je-mappelle-Huong vấp đúng
# lỗi này và chữa bằng cách tách job: job sau phải chờ cấp máy mới, đủ chục
# giây cho API kịp. Đây cũng là khuôn mẫu Pages chính thức của GitHub.
#
# ĐỪNG CHẠY LẠI JOB HỎNG để chữa: upload-pages-artifact đặt overwrite: false,
# mỗi lần chạy lại thêm một artifact cùng tên và run ấy không bao giờ qua được.
# Muốn phát hành lại thì đẩy một commit mới.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Skill cho trợ lý AI là công cụ làm việc, không phải nội dung trang.
      - run: rm -rf .claude
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
